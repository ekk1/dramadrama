{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · dramadrama</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/projects">dramadrama</a>
  <nav>
    <a href="/projects" {{if eq .Nav "projects"}}class="active"{{end}}>Projects</a>
    <a href="/assets" {{if eq .Nav "assets"}}class="active"{{end}}>Asset library</a>
    <a href="/prompts" {{if eq .Nav "prompts"}}class="active"{{end}}>Prompts</a>
    <a href="/settings" {{if eq .Nav "settings"}}class="active"{{end}}>Settings</a>
  </nav>
</header>
{{if .Err}}<div class="flash error" role="alert">{{.Err}}<button type="button" class="flash-close" aria-label="Dismiss">×</button></div>{{end}}
{{if .Msg}}<div class="flash ok" role="status">{{.Msg}}<button type="button" class="flash-close" aria-label="Dismiss">×</button></div>{{end}}
<main>
{{template "content" .}}
</main>

<dialog id="picker">
  <form method="dialog" class="picker-head">
    <strong>Pick from asset library</strong>
    <select id="picker-scope" aria-label="Scope">
      <option value="project">This project</option>
      <option value="">All projects</option>
    </select>
    <select id="picker-kind" aria-label="Kind">
      <option value="">Any kind</option>
      {{range kinds}}<option value="{{.}}">{{.}}</option>{{end}}
    </select>
    <input id="picker-q" type="search" placeholder="Search name, prompt, tag" aria-label="Search">
    <button value="cancel">Close</button>
  </form>
  <div id="picker-grid" class="picker-grid"></div>
</dialog>
</body>
</html>{{end}}
